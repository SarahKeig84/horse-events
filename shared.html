<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Horse Events</title>
<meta name="description" content="A shared, auto-updating horse events calendar" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="app-header">
  <h1>🐴 Horse Events</h1>
  <p class="updated-line" id="updatedLine"></p>
</header>

<div class="owner-bar hidden" id="ownerBar">
  <a href="#" id="addVenueLink">+ Add a venue</a>
  <button type="button" id="deleteListBtn">Delete this calendar</button>
</div>

<p class="hidden" id="freshnessNotice" style="max-width:720px;margin:8px auto 0;padding:0 16px;font-size:0.78rem;color:var(--ink-soft);">
  Fetching events for your new venue — this can take about a minute to show up. Refresh the page shortly if you don't see it yet.
</p>

<div class="toolbar">
  <div class="search-wrap">
    <input type="search" id="searchInput" placeholder="Search events, venues, or type…" aria-label="Search events" />
  </div>
  <div class="view-toggle" role="tablist" aria-label="View">
    <button class="toggle-btn active" id="calendarViewBtn" role="tab" aria-selected="true">Calendar</button>
    <button class="toggle-btn" id="listViewBtn" role="tab" aria-selected="false">List</button>
  </div>
</div>

<div class="venue-filter-wrap">
  <details class="venue-filter" id="venueFilter">
    <summary>
      <span>Venues</span>
      <span class="venue-filter-count" id="venueFilterCount"></span>
    </summary>
    <div class="venue-filter-panel">
      <div class="venue-filter-actions">
        <button type="button" id="showAllVenues">Show all</button>
        <button type="button" id="hideAllVenues">Hide all</button>
      </div>
      <div class="legend" id="legend" aria-label="Filter by venue"></div>
    </div>
  </details>
</div>

<main id="mainContent">

  <section id="calendarView" class="view">
    <div class="cal-nav">
      <button id="prevMonth" aria-label="Previous month">‹</button>
      <h2 id="monthLabel"></h2>
      <button id="nextMonth" aria-label="Next month">›</button>
    </div>
    <div class="cal-weekdays">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </section>

  <section id="listView" class="view hidden">
    <div id="listContainer"></div>
  </section>

  <p id="emptyState" class="empty-state hidden">No events match your search/filters.</p>

  <section class="gaps hidden" id="gapsSection">
    <h3>Known gaps</h3>
    <ul id="gapsList"></ul>
  </section>

  <p style="text-align:center; margin-top: 24px;">
    <a href="create.html" style="color: var(--ink-soft); font-size: 0.8rem;">Build your own calendar &rarr;</a>
  </p>

</main>

<div class="modal-backdrop hidden" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalDate">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <h3 id="modalDate"></h3>
    <div id="modalEvents"></div>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/calendar-core.js"></script>
<script src="js/list-events.js"></script>
<script src="js/shared.js"></script>
</body>
</html>
