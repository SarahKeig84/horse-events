name: Update horse events data

on:
  schedule:
    # 06:00 UTC daily
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scripts/update_events.py

      - name: Commit updated data if changed
        run: |
          git config user.name "horse-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update event data"

          # Someone may have pushed (e.g. a manual data edit) while this run
          # was scraping, which would make a plain push fail as non-fast-forward.
          # Rebase onto the latest remote and retry a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully"
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- fetching and rebasing"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict -- keeping this run's data as-is on top"
              git rebase --abort
              git reset --soft origin/main
              git commit -m "Auto-update event data"
            fi
            sleep 5
          done
          echo "Failed to push after multiple attempts"
          exit 1
